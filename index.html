<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Street Biathlon</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Street Biathlon">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/tf.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <video id="video" playsinline muted></video>
  <canvas id="jeu"></canvas>
  <div id="pas-de-tir" hidden>
    <p id="erreur-camera"></p>
    <button id="position-tir" type="button" disabled>Position de tir</button>
    <button id="skip" type="button" hidden>Skip</button>
    <div id="suivi">
      <div><span>Temps</span><strong id="suivi-temps">0:00</strong></div>
      <div><span>Parcouru</span><strong id="suivi-distance">0 m</strong></div>
    </div>
    <button id="fin-course" type="button">Fin de course</button>
  </div>
  <div id="recap" hidden>
    <h2>Statistiques</h2>
    <dl id="recap-chiffres"></dl>
    <canvas id="carte"></canvas>
    <button id="nouvelle-partie" type="button">Nouvelle partie</button>
  </div>
  <div id="accueil">
    <h1>Street Biathlon</h1>
    <button id="demarrer" type="button">Top départ!</button>
    <p id="statut"></p>
    <p id="version">v1.3.5</p>
  </div>
</body>
</html>
