<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Street Biathlon</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Street Biathlon">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/tf.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <video id="video" playsinline muted></video>
  <canvas id="jeu"></canvas>
  <div id="pas-de-tir" hidden>
    <p id="erreur-camera"></p>
    <button id="position-tir" type="button" disabled>Position de tir</button>
    <button id="skip" type="button" hidden>Skip</button>
    <button id="fin-course" type="button">Fin de course</button>
  </div>
  <div id="recap" hidden>
    <canvas id="carte"></canvas>
    <h2 class="cache">Statistiques</h2>
    <div id="recap-score"><span>Score</span><strong id="recap-points"></strong></div>
    <ul id="legende">
      <li><i class="depart"></i>Départ</li>
      <li><i class="arrivee"></i>Arrivée</li>
      <li><i class="tir"></i>Pas de tir</li>
    </ul>
    <dl id="recap-chiffres"></dl>
    <button id="nouvelle-partie" type="button">Nouvelle partie</button>
  </div>
  <div id="accueil">
    <h1><span>Street</span>Biathlon</h1>
    <div id="cible-accueil" aria-hidden="true"><i></i><i></i><i></i></div>
    <button id="demarrer" type="button">Top départ!</button>
    <p id="statut"></p>
    <p id="version">v1.4.1</p>
  </div>
</body>
</html>
